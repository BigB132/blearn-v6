<!DOCTYPE html>
<html>

    <head>

        <title>Blearn | Subjects</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="mainModules/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>

    <body>

        <h1>Subjects</h1>
        <p class="subtitle">Here you can manage all your subjects.</p>

        <div class="box">
            <h2>Your subjects</h2>
            <div id="subjects" class="flexbox">
                <p id="subject-text">Loading...</p>
            </div>
        </div>

        <!-- add div -->
        <div id="adddiv" class="box">
            <h2>Add a new subject</h1>
            <div class="flexbox">

                <div class="subject-group">
                    <p>Name</p>
                    <input id="name" class="textinput" type="text" placeholder="Math, English, Spanish...">
                </div>
                <div>
                    <p>Color</p>
                    <input id="color" class="colorinput" type="color" placeholder="Choose a color">
                </div>
                <div>
                    <p>Teacher</p>
                    <input id="teacher" class="textinput" type="text" placeholder="Mr. Thompson">
                </div>
                
            </div>

            <button id="add-subject" class="submitbtn">Add</button>
        </div>

        <!-- edit div -->
        <div id="editdiv" class="box">
            <h2>Edit a subject</h1>
            <div class="flexbox">

                <div class="subject-group">
                    <p>Name</p>
                    <input id="editname" class="textinput" type="text" placeholder="Math, English, Spanish...">
                </div>
                <div>
                    <p>Color</p>
                    <input id="editcolor" class="colorinput" type="color" placeholder="Choose a color">
                </div>
                <div>
                    <p>Teacher</p>
                    <input id="editteacher" class="textinput" type="text" placeholder="Mr. Thompson">
                </div>
                
            </div>

            <div class="flexbox">
                <button id="cancel-edit-button" class="cancelbtn">cancel</button>
                <button id="edit-button" class="submitbtn">Edit</button>
            </div>
        </div>

        <script src="/mainModules/subjects.js"></script>

    </body>

</html>
