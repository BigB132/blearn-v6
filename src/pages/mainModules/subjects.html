<!DOCTYPE html>
<html>

    <head>

        <title>Blearn | Subjects</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="mainModules/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>

    <body>

        <h1>Subjects</h1>
        <p class="subtitle">Here you can manage all your subjects.</p>

        <div id="subjects" class="box">
            <p>Loading...</p>
        </div>

        <div class="box">
            <h2>Add a new subject</h1>
            <div class="flexbox">

                <div class="subject-group">
                    <p>Name</p>
                    <input type="text" placeholder="Math, English, Spanish..." class="textinput">
                </div>
                <div>
                    <p>Color</p>
                    <input type="color" placeholder="Choose a color" class="colorinput">
                </div>
                <div>
                    <p>Teacher</p>
                    <input type="text" placeholder="Mr. Thompson" class="textinput">
                </div>
                
            </div>

            <button class="submitbtn">Add</button>
        </div>

    </body>

</html>
