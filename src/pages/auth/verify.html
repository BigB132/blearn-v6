<!DOCTYPE html>
<html>
    <head>

        <title>Email Verification</title>
        <link rel="stylesheet" href="/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="center">
            <div class="form">
                <h1>Email Verification</h1>
                <p class="subtitle">Verify your email to get started.</p>
                <br>
                <p>Enter the code we've sent to your email:</p>
                <div class="nums">
                    <input class="num" id="num1" type="text" maxlength="1" placeholder="0" autofocus>
                    <input class="num" id="num2" type="text" maxlength="1" placeholder="0">
                    <input class="num" id="num3" type="text" maxlength="1" placeholder="0">
                    <input class="num" id="num4" type="text" maxlength="1" placeholder="0">
                    <input class="num" id="num5" type="text" maxlength="1" placeholder="0">
                    <input class="num" id="num6" type="text" maxlength="1" placeholder="0">
                </div>
                <br>
                <button id="submit">Submit</button>
            </div>
        </div>

        <script src="/auth/verify.js"></script>
    </body>
</html>
