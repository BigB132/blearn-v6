<!DOCTYPE html>
<html>
    <head>

        <title>Blearn | Register</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="/auth/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="center">
            <div class="form">
                <h1>Register</h1>
                <p class="subtitle">Welcome to Blearn!</p>
                <p>Username:</p>
                <input class="input" id="username" placeholder="Bob">
                <p>Email:</p>
                <input class="input" id="email" type="email" placeholder="bob@gmail.com">
                <p>Password:</p>
                <input class="input" id="password" type="password" placeholder="Safe Password">
                <p><span>Already have an account? </span><a href="login">Login</a></p>

                <br>
                <br>
                <button id="submit">Register</button>
            </div>
        </div>

        <script src="/auth/register.js"></script>
    </body>
</html>
